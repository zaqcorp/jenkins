services:
  jenkins:
    image: ${REGISTRY_PREFIX:-}jenkins:lts-jdk21
    restart: on-failure
    networks:
      - docker-kit-network
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home

volumes:
  jenkins_data:
    external: true

networks:
  docker-kit-network:
    external: true
